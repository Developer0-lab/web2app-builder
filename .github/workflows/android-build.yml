name: Build Android App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      web_app_url:
        description: 'Website URL to package'
        required: true
        default: 'https://example.com'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure website URL
        env:
          WEB_APP_URL: ${{ inputs.web_app_url || 'https://example.com' }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path('app/build.gradle.kts')
          s = p.read_text()
          url = os.environ['WEB_APP_URL'].replace('\\', '\\\\').replace('"', '\\"')
          import re
          s = re.sub(r'buildConfigField\("String", "WEB_APP_URL", ".*?"\)', f'buildConfigField("String", "WEB_APP_URL", "\\"{url}\\"")', s)
          p.write_text(s)
          print(f'Configured website URL: {url}')
          PY

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release AAB
        run: gradle bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2app-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: web2app-aab
          path: app/build/outputs/bundle/release/*.aab
